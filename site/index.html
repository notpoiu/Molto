<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Molto: Icon Registry for Roblox</title>
<meta name="description" content="An Icon registry for Roblox.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='none' stroke='%23ff8a3d' stroke-width='2' stroke-linecap='round' stroke-linejoin='round' d='M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="home.css?v=8">
<script>document.documentElement.classList.add("js")</script>
</head>
<body>

<header class="top">
  <a class="mark" href="./">Molto</a>
  <nav aria-label="Main">
    <a href="icons/">Icons</a>
    <a href="https://github.com/notpoiu/Molto" rel="noopener">GitHub</a>
  </nav>
</header>

<main>
  <section class="hero" aria-labelledby="h1">
    <pre class="ascii" id="ascii" aria-hidden="true"></pre>
    <div class="hero-copy">
      <h1 id="h1">Molto</h1>
      <p class="lead">An <code>Icon Registry</code> for Roblox executors.</p>
      <div class="actions">
        <a class="btn" href="icons/">Browse icons</a>
        <button class="btn ghost" type="button" id="copy">Copy loader</button>
      </div>
    </div>
    <div class="arc" aria-hidden="true"></div>
  </section>

  <section class="load" aria-labelledby="load-h">
    <h2 id="load-h">Icons available</h2>
    <figure class="beam" id="beam">
      <svg viewBox="0 0 800 880" role="group" aria-label="Pick the icon sets to load" id="beam-svg"></svg>
      <figcaption><output id="total" aria-live="polite">0</output> icons</figcaption>
    </figure>
  </section>
</main>

<footer class="foot">
  <a href="icons/">Icons</a>
  <a href="https://github.com/notpoiu/Molto" rel="noopener">GitHub</a>
  <span>Moon photo: Gregory H. Revera, <a href="https://creativecommons.org/licenses/by-sa/3.0/" rel="noopener">CC BY-SA 3.0</a></span>
</footer>

<p class="toast" id="toast" role="status"></p>
<script src="home.js?v=7"></script>
</body>
</html>
