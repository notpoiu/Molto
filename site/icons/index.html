<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Icons | Molto</title>
<meta name="description" content="Search icons from Lucide, Tabler, Heroicons, Phosphor, Fluent, Solar, Material Symbols, Feather and Font Awesome, tune color and size, and copy the Roblox code.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='none' stroke='%23ff8a3d' stroke-width='2' stroke-linecap='round' stroke-linejoin='round' d='M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z'/%3E%3C/svg%3E">
<link rel="stylesheet" href="../base.css?v=2">
<link rel="stylesheet" href="style.css?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
<div class="app">
  <aside class="side">
    <a class="brand" href="../" aria-label="Molto home">
      <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <span>Molto</span>
    </a>

    <section class="panel" aria-labelledby="cz-title">
      <header>
        <h2 id="cz-title">Customizer</h2>
        <button class="icon-btn" id="reset" type="button" aria-label="Reset customizer" title="Reset">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
        </button>
      </header>

      <div class="ctl">
        <label for="color-text">Color</label>
        <div class="color-row">
          <input id="color" type="color" value="#ffffff" aria-label="Pick a color">
          <input id="color-text" type="text" placeholder="[default]" spellcheck="false" autocomplete="off" maxlength="7">
        </div>
      </div>

      <div class="ctl">
        <div class="ctl-head"><label for="size">Size</label><output id="size-out">24px</output></div>
        <input id="size" type="range" min="12" max="64" step="1" value="24">
      </div>

      <div class="ctl switch" id="nss-ctl">
        <label for="nss">Non-scaling stroke</label>
        <input id="nss" type="checkbox" role="switch">
      </div>
    </section>

    <section class="panel code" aria-labelledby="cg-title">
      <header>
        <h2 id="cg-title">Code</h2>
        <button class="icon-btn" id="cg-reset" type="button" aria-label="Reset code settings" title="Reset">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
        </button>
      </header>

      <div class="ctl switch"><label for="cg-load">Include loadstring</label><input id="cg-load" type="checkbox" role="switch"></div>
      <div class="ctl switch"><label for="cg-provider">Set the provider</label><input id="cg-provider" type="checkbox" role="switch"></div>
      <div class="ctl switch"><label for="cg-preload">Preload the icon</label><input id="cg-preload" type="checkbox" role="switch"></div>
      <div class="ctl switch"><label for="cg-style">Apply size and color</label><input id="cg-style" type="checkbox" role="switch"></div>

      <div class="ctl">
        <label for="cg-format">Copy Luau as</label>
        <select id="cg-format" class="field">
          <option value="auto">Font when available</option>
          <option value="font">Font (TextLabel)</option>
          <option value="image">Sprite (ImageLabel)</option>
        </select>
      </div>

      <div class="ctl">
        <label for="cg-var">Registry variable</label>
        <input id="cg-var" class="field" type="text" value="Icons" spellcheck="false" autocomplete="off" maxlength="24">
      </div>
    </section>

    <nav class="providers" aria-label="Icon providers">
      <h3>Provider</h3>
      <ul id="providers"></ul>
    </nav>
  </aside>

  <div class="content">
    <header class="topnav">
      <nav>
        <a href="../">Home</a>
        <a href="../#usage">Usage</a>
        <a href="https://github.com/notpoiu/Molto" rel="noopener">GitHub</a>
      </nav>
    </header>

    <div class="toolbar">
      <label class="search">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="search" type="search" placeholder="Search icons…" autocomplete="off" spellcheck="false" aria-label="Search icons">
        <kbd id="kbd">/</kbd>
      </label>
      <label class="sort">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M3 12h12M3 18h6"/></svg>
        <select id="sort" aria-label="Sort icons">
          <option value="az">A to Z</option>
          <option value="za">Z to A</option>
          <option value="short">Shortest name</option>
        </select>
      </label>
    </div>

    <p class="status" id="status" role="status"></p>
    <div class="grid" id="grid" role="listbox" aria-label="Icons"></div>
    <div id="sentinel" aria-hidden="true"></div>
  </div>
</div>

<section class="drawer" id="drawer" aria-label="Icon details" hidden>
  <div class="d-preview" id="d-preview"></div>

  <div class="d-body">
    <div class="d-title">
      <h2 id="d-name"></h2>
      <span class="chip" id="d-meta"></span>
    </div>
    <p class="d-aliases" id="d-aliases"></p>

    <div class="d-actions">
      <div class="split">
        <button class="btn primary main" id="b-lua" type="button">Copy Luau</button>
        <button class="btn primary caret" type="button" data-menu="m-lua" aria-label="More Luau options" aria-haspopup="menu" aria-expanded="false">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 15 6-6 6 6"/></svg>
        </button>
        <div class="menu" id="m-lua" role="menu" hidden>
          <button type="button" role="menuitem" data-act="lua-font" id="mi-font">Copy Luau (TextLabel, font)</button>
          <button type="button" role="menuitem" data-act="lua-image">Copy Luau (ImageLabel, sprite)</button>
          <button type="button" role="menuitem" data-act="name">Copy name</button>
        </div>
      </div>

      <div class="split">
        <button class="btn main" id="b-svg" type="button">Copy SVG</button>
        <button class="btn caret" type="button" data-menu="m-svg" aria-label="More SVG options" aria-haspopup="menu" aria-expanded="false">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 15 6-6 6 6"/></svg>
        </button>
        <div class="menu" id="m-svg" role="menu" hidden>
          <button type="button" role="menuitem" data-act="svg">Copy SVG</button>
          <button type="button" role="menuitem" data-act="data-url">Copy Data URL</button>
          <button type="button" role="menuitem" data-act="dl-svg">Download SVG</button>
          <button type="button" role="menuitem" data-act="dl-png">Download PNG</button>
        </div>
      </div>
    </div>
    <p class="d-hint" id="d-hint" hidden>This provider has no font, so icons are 24px sprites and look soft above that size.</p>
  </div>

  <button class="icon-btn d-close" id="d-close" type="button" aria-label="Close details">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
  </button>
</section>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="app.js?v=11"></script>
</body>
</html>
